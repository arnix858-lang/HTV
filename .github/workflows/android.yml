name: Build universal Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HTV source
        uses: actions/checkout@v4
        with:
          repository: HTWMedia/HTV
          path: source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Set Russian as the default app language
        working-directory: source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("lib/main.dart")
          text = p.read_text()
          text = text.replace(
              'supportedLocales: const [Locale("zh", "CH"), Locale("en", "US")],',
              'locale: const Locale("ru", "RU"),\n            supportedLocales: const [Locale("ru", "RU"), Locale("zh", "CN"), Locale("en", "US")],'
          )
          if 'locale: const Locale("ru", "RU")' not in text:
              raise SystemExit("Could not find MaterialApp supportedLocales declaration")
          p.write_text(text)
          PY


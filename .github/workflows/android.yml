          from pathlib import Path
          p = Path("lib/pages/iptv/view.dart")
          s = p.read_text()
          marker = """    updateStore.loadCurrentVersion();
              updateStore.refreshLatestRelease();"""
          if "Доступно обновление HTV" not in s:
              dialog = """    await updateStore.loadCurrentVersion();
              await updateStore.refreshLatestRelease();
              if (mounted && updateStore.hasUpdate && updateStore.latestRelease.downloadUrl.isNotEmpty) {
                WidgetsBinding.instance.addPostFrameCallback((_) {
                  if (!mounted) return;
                  showDialog<void>(
                    context: context,
                    builder: (dialogContext) => AlertDialog(
                      title: const Text('Доступно обновление HTV'),
                      content: Text('Новая версия: ${updateStore.latestRelease.tagName}'),
                      actions: [
                        TextButton(
                          onPressed: () => Navigator.of(dialogContext).pop(),
                          child: const Text('Позже'),
                        ),
                        FilledButton(
                          onPressed: () {
                            Navigator.of(dialogContext).pop();
                            updateStore.downloadAndInstall();
                          },
                          child: const Text('Скачать и установить'),
                        ),
                      ],
                    ),
                  );
                });
              }"""
              if marker not in s:
                  raise SystemExit("Could not locate update check calls in IPTV page")
              s = s.replace(marker, dialog, 1)
              p.write_text(s)
          PY

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Configure release version
        working-directory: source
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("pubspec.yaml")
          s = p.read_text()
          run = os.environ["GITHUB_RUN_NUMBER"]
          s, n = re.subn(r"^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+", lambda m: f"version: 6.0.{run}+{run}", s, count=1, flags=re.M)
          if n != 1:
              raise SystemExit("Could not set an increasing app version")
          p.write_text(s)
          PY

      - name: Cache Gradle distributions and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('source/android/gradle/wrapper/gradle-wrapper.properties', 'source/android/build.gradle', 'source/android/settings.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Build universal APK
        working-directory: source
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=TMDB_API_KEY="$TMDB_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HTV-universal-APK
          path: source/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.0.${{ github.run_number }}
          name: HTV 6.0.${{ github.run_number }}
          generate_release_notes: true
          files: source/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build universal Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HTV source
        uses: actions/checkout@v4
        with:
          repository: HTWMedia/HTV
          path: source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Fix intl constraint for Flutter 3.24.5
        working-directory: source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("pubspec.yaml")
          p.write_text(p.read_text().replace("intl: ^0.18.1", "intl: ^0.19.0"))
          PY

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Build universal APK
        working-directory: source
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HTV-universal-APK
          path: source/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

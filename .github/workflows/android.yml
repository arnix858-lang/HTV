      - name: Fix intl constraint for Flutter 3.24.5
        working-directory: source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("pubspec.yaml")
          text = p.read_text().replace("intl: ^0.18.1", "intl: ^0.19.0")
          if "dependency_overrides:" not in text:
              text += "\n\ndependency_overrides:\n  win32: 5.5.1\n"
          p.write_text(text)
          PY

      - name: Configure in-app GitHub updater
        working-directory: source
        run: |
          python - <<'PY'
          from pathlib import Path

          # Configure this repository as the release source.
          p = Path("lib/common/values/constants.dart")
          s = p.read_text()
          s = s.replace(
              "https://api.github.com/repos/HTWMedia/HTV/releases/latest",
              "https://api.github.com/repos/arnix858-lang/HTV/releases/latest")
          s = s.replace(
              "https://github.com/HTWMedia/HTV/releases/latest",
              "https://github.com/arnix858-lang/HTV/releases/latest")
          p.write_text(s)

          # Download the APK asset rather than the first arbitrary release asset.
          p = Path("lib/common/stores/update.dart")
          s = p.read_text()
          s = s.replace("import 'dart:io';",
                        "import 'dart:io';\nimport 'package:flutter/services.dart';")
          old = """downloadUrl: result['assets'] != null && result['assets'].isNotEmpty
                  ? result['assets'][0]['browser_download_url'] ?? ''
                  : '',"""
          new = """downloadUrl: result['assets'] is List
                  ? ((result['assets'] as List).cast<Map>().firstWhere(
                      (asset) => (asset['name'] ?? '').toString().toLowerCase().endsWith('.apk'),
                      orElse: () => <String, dynamic>{},
                    )['browser_download_url'] ?? '').toString()
                  : '',"""
          if old in s:
              s = s.replace(old, new)
          old_install = """  Future<void> _installApk(String path) async {
              try {
                await Process.run('am', [
                  'start',
                  '-a', 'android.intent.action.VIEW',
                  '-d', 'file://$path',
                  '-t', 'application/vnd.android.package-archive',
                ]);
              } catch (e) {
                _logger.error('安装失败: $e');
              }
            }"""
          new_install = """  Future<void> _installApk(String path) async {
              try {
                const channel = MethodChannel('com.htwmedia.htv/updater');
                await channel.invokeMethod('installApk', {'path': path});
              } catch (e) {
                _logger.error('Не удалось открыть установщик Android: $e');
                downloadProgress = 'Не удалось открыть установщик';
              }
            }"""
          if old_install in s:
              s = s.replace(old_install, new_install)
          if "MethodChannel('com.htwmedia.htv/updater')" not in s:
              raise SystemExit("Updater Dart installer patch did not apply")
          p.write_text(s)

          # Add Android's FileProvider installer bridge without replacing existing security handlers.
          p = Path("android/app/src/main/kotlin/io/flutter/plugins/MainActivity.kt")
          s = p.read_text()
          if "com.htwmedia.htv/updater" not in s:
              s = s.replace("import android.os.Build",
                            "import android.os.Build\nimport android.content.Intent\nimport android.net.Uri\nimport androidx.core.content.FileProvider")
              marker = "        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler"
              bridge = '''        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.htwmedia.htv/updater").setMethodCallHandler { call, result ->
                  if (call.method == "installApk") {
                      try {
                          val path = call.argument<String>("path") ?: throw IllegalArgumentException("APK path missing")
                          val apk = File(path)
                          if (!apk.exists()) throw IllegalArgumentException("APK file not found")
                          val uri: Uri = FileProvider.getUriForFile(this, "$packageName.fileprovider", apk)
                          val intent = Intent(Intent.ACTION_VIEW).apply {
                              setDataAndType(uri, "application/vnd.android.package-archive")
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          }
                          startActivity(intent)
                          result.success(true)
                      } catch (e: Exception) {
                          result.error("INSTALL_FAILED", e.message, null)
                      }
                  } else {
                      result.notImplemented()
                  }
              }

          '''
              if marker not in s:
                  raise SystemExit("MainActivity MethodChannel marker not found")
              s = s.replace(marker, bridge + marker, 1)
          p.write_text(s)

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "REQUEST_INSTALL_PACKAGES" not in s:
              s = s.replace('<uses-permission android:name="android.permission.INTERNET"/>',
                            '<uses-permission android:name="android.permission.INTERNET"/>\n  <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>')
          if "com.htwmedia.htv.fileprovider" not in s:
              provider = '''    <provider
              android:name="androidx.core.content.FileProvider"
              android:authorities="com.htwmedia.htv.fileprovider"
              android:exported="false"
              android:grantUriPermissions="true">
              <meta-data
                  android:name="android.support.FILE_PROVIDER_PATHS"
                  android:resource="@xml/file_paths" />
          </provider>
          '''
              s = s.replace('    <receiver android:name="io.flutter.plugins.BootReceiver"', provider + '    <receiver android:name="io.flutter.plugins.BootReceiver"', 1)
          p.write_text(s)

          paths = Path("android/app/src/main/res/xml")
          paths.mkdir(parents=True, exist_ok=True)
          (paths / "file_paths.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="updates" path="." />
          </paths>
          ''')
          PY

      - name: Check for update dialog on app start

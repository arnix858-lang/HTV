              '源地址为空': 'Адрес источника пуст',
              '运营商公网转播(txiptv)，playseek 参数实测被忽略': 'Ретрансляция оператора (txiptv): параметр playseek не поддерживает архив',
              '央视官方 HLS，lbacks 参数实测被忽略': 'Официальный HLS CCTV: параметр lbacks не поддерживает архив',
              '普通直播源，服务端未声明回看能力': 'Обычный источник: сервер не поддерживает архив',
              '回看不可用': 'Архив недоступен',
              '没有可回看的节目': 'Нет передач для просмотра в записи',
              '无法拼出回看地址': 'Не удалось сформировать ссылку на архив',
              '回看未生效': 'Архив не запустился',
              '回看': 'Архив',
              '已开始': 'запущен',
              '下载更新': 'Скачать обновление',
              '检查中...': 'Проверка...',
              '已是最新': 'Установлена последняя версия',
              '秒': 'с',
              '分钟': 'мин',
              '小时': 'ч',
          }
          files = list(Path("lib").rglob("*.dart"))
          for p in files:
              source = p.read_text()
              updated = source
              for old, new in sorted(replacements.items(), key=lambda item: len(item[0]), reverse=True):
                  updated = updated.replace(old, new)
              if updated != source:
                  p.write_text(updated)
          PY

      - name: Fix intl constraint for Flutter 3.24.5
        working-directory: source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("pubspec.yaml")
          text = p.read_text().replace("intl: ^0.18.1", "intl: ^0.19.0")
          if "dependency_overrides:" not in text:
              text += "\n\ndependency_overrides:\n  win32: 5.5.1\n"
          p.write_text(text)
          PY

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Build universal APK
        working-directory: source
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HTV-universal-APK
          path: source/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
